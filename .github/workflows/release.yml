name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: '版本更新说明 (Release Notes)'
        required: false
        default: '常规版本发布'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK
        run: |
          # 找到最新的 apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"

          # 自动生成专用签名证书
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias releaseKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "systemApksRelease2026" \
            -keypass "systemApksRelease2026" \
            -dname "CN=SystemApks, OU=Mobile, O=Eoncn, L=Shenzhen, ST=Guangdong, C=CN"

          # 确定版本号与文件名
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$TAG_NAME" ]; then
            TAG_NAME="v$(date +'%Y%m%d%H%M')"
          fi
          APK_NAME="systemApks-${TAG_NAME}.apk"

          # 执行 v1 + v2 + v3 签名
          $APKSIGNER sign \
            --ks release.jks \
            --ks-pass "pass:systemApksRelease2026" \
            --key-pass "pass:systemApksRelease2026" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK_NAME" \
            app/build/outputs/apk/release/app-release-unsigned.apk

          # 验证签名有效性
          $APKSIGNER verify --verbose "$APK_NAME"

          # 生成 SHA256 校验和文件
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"

          echo "SIGNED_APK=$APK_NAME" >> $GITHUB_ENV
          echo "SIGNED_APK_SHA256=${APK_NAME}.sha256" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-apk
          path: |
            ${{ env.SIGNED_APK }}
            ${{ env.SIGNED_APK_SHA256 }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "systemApks ${{ env.RELEASE_TAG }}"
          body: |
            ## 📱 systemApks ${{ env.RELEASE_TAG }}

            ### ✨ 功能介绍
            - 快速读取系统内所有应用包名及当前语言下的应用名称
            - 支持「全部应用」与「仅可启动」视图一键切换与实时筛选
            - 支持一键复制应用清单至剪贴板，方便在其他应用间分享
            - 兼容 Android 7.0 及以上版本（minSdk 24，targetSdk 36）
            - 安装包已完成数字签名，下载即可直接在手机上安装运行

            ---
            **更新说明**：
            ${{ github.event.inputs.release_notes || '常规版本发布与构建' }}
          files: |
            ${{ env.SIGNED_APK }}
            ${{ env.SIGNED_APK_SHA256 }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
